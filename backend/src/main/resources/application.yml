server:
  port: ${SERVER_PORT:8080}

spring:
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 11MB
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/mydb}
    username: ${DB_USERNAME:myuser}
    password: ${DB_PASSWORD:mypassword}
    driver-class-name: org.postgresql.Driver
  flyway:
    enabled: true
    locations: classpath:db/migration

mybatis:
  mapper-locations: classpath*:mapper/**/*.xml
  type-handlers-package: com.platform.reservation
  configuration:
    map-underscore-to-camel-case: true

security:
  admin-bootstrap-key: ${ADMIN_BOOTSTRAP_KEY:}
  jwt:
    secret: ${JWT_SECRET}

appliance:
  evidence:
    storage-path: ${WORK_EVIDENCE_PATH:uploads/work-evidence}
  request-image:
    storage-path: ${REQUEST_IMAGE_PATH:uploads/request-images}

technician:
  assignment:
    automatic-enabled: ${TECHNICIAN_ASSIGNMENT_AUTOMATIC_ENABLED:false}

toss:
  payments:
    client-key: ${TOSS_PAYMENTS_CLIENT_KEY:}
    secret-key: ${TOSS_PAYMENTS_SECRET_KEY:}
    base-url: ${TOSS_PAYMENTS_BASE_URL:https://api.tosspayments.com}
    webhook-secret: ${TOSS_PAYMENTS_WEBHOOK_SECRET:}

openai:
  api-key: ${OPENAI_API_KEY:}
  model: ${OPENAI_MODEL:gpt-4o-mini}
