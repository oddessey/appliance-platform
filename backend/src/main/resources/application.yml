server:
  port: ${SERVER_PORT:8080}

spring:
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 11MB
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/mydb}
    username: ${DB_USERNAME:myuser}
    password: ${DB_PASSWORD:mypassword}
    driver-class-name: org.postgresql.Driver
  flyway:
    enabled: true
    locations: classpath:db/migration

security:
  admin-bootstrap-key: ${ADMIN_BOOTSTRAP_KEY:}
  jwt:
    secret: ${JWT_SECRET}

appliance:
  evidence:
    storage-path: ${WORK_EVIDENCE_PATH:uploads/work-evidence}
  request-image:
    storage-path: ${REQUEST_IMAGE_PATH:uploads/request-images}

technician:
  assignment:
    automatic-enabled: ${TECHNICIAN_ASSIGNMENT_AUTOMATIC_ENABLED:false}
